<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1010" viewBox="0 0 1140 1010" font-family="Arial, Helvetica, sans-serif"><title>Assistant workflow: one turn through the LangGraph supervisor graph</title><rect width="100%" height="100%" fill="white"/><text x="570" y="22" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">One assistant turn (LangGraph supervisor graph)</text><rect x="445" y="46" width="250" height="40" rx="20" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="570.0" y="66.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">User message</text><polyline points="570,86 570,112" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="570,112 566.3301559224639,103.78219953718923 573.6698440775361,103.78219953718923" fill="#334155"/><rect x="445" y="112" width="250" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="570.0" y="130.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Input guard</text><text x="570.0" y="147.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">checks for injection and harm,</text><text x="570.0" y="164.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">redacts secrets</text><rect x="830" y="112" width="270" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/><text x="965.0" y="130.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Blocked: fixed refusal</text><text x="965.0" y="147.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">no LLM call; the message is</text><text x="965.0" y="164.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">replaced in the history</text><polyline points="695,147 830,147" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="830,147 821.7821995371892,150.66984407753614 821.7821995371892,143.33015592246386" fill="#334155"/><text x="762" y="136" font-size="11.5" fill="#475569" text-anchor="middle" dominant-baseline="central">injection or harmful</text><polyline points="570,182 570,222" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="570,222 566.3301559224639,213.78219953718923 573.6698440775361,213.78219953718923" fill="#334155"/><text x="580" y="202" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">allowed</text><rect x="445" y="222" width="250" height="66" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="570.0" y="238.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Supervisor (router)</text><text x="570.0" y="255.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">LLM picks one route</text><text x="570.0" y="272.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">for the question</text><rect x="33" y="340" width="168" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="117.0" y="360.0" font-size="11.5" fill="#7C3AED" text-anchor="middle" dominant-baseline="central">classify</text><text x="117.0" y="377.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Classification</text><text x="117.0" y="394.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">agent</text><polyline points="570,288 570,312 117.0,312 117.0,340" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="117.0,340 113.33015592246387,331.78219953718923 120.66984407753613,331.78219953718923" fill="#334155"/><rect x="215" y="340" width="168" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="299.0" y="360.0" font-size="11.5" fill="#7C3AED" text-anchor="middle" dominant-baseline="central">risk</text><text x="299.0" y="377.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Risk &amp; Priority</text><text x="299.0" y="394.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">agent</text><polyline points="570,288 570,312 299.0,312 299.0,340" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="299.0,340 295.33015592246386,331.78219953718923 302.66984407753614,331.78219953718923" fill="#334155"/><rect x="397" y="340" width="168" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="481.0" y="360.0" font-size="11.5" fill="#7C3AED" text-anchor="middle" dominant-baseline="central">search</text><text x="481.0" y="377.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Incident Search</text><text x="481.0" y="394.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">agent</text><polyline points="570,288 570,312 481.0,312 481.0,340" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="481.0,340 477.33015592246386,331.78219953718923 484.66984407753614,331.78219953718923" fill="#334155"/><rect x="579" y="340" width="168" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="663.0" y="360.0" font-size="11.5" fill="#7C3AED" text-anchor="middle" dominant-baseline="central">recommend</text><text x="663.0" y="377.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Response</text><text x="663.0" y="394.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">agent</text><polyline points="570,288 570,312 663.0,312 663.0,340" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="663.0,340 659.3301559224639,331.78219953718923 666.6698440775361,331.78219953718923" fill="#334155"/><rect x="761" y="340" width="168" height="74" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="845.0" y="360.0" font-size="11.5" fill="#7C3AED" text-anchor="middle" dominant-baseline="central">investigate</text><text x="845.0" y="377.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">All four agents</text><text x="845.0" y="394.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">in this order</text><polyline points="570,288 570,312 845.0,312 845.0,340" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="845.0,340 841.3301559224639,331.78219953718923 848.6698440775361,331.78219953718923" fill="#334155"/><rect x="943" y="340" width="168" height="74" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="1027.0" y="360.0" font-size="11.5" fill="#475569" text-anchor="middle" dominant-baseline="central">general / out of scope</text><text x="1027.0" y="377.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">No tools</text><text x="1027.0" y="394.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">answer directly</text><polyline points="570,288 570,312 1027.0,312 1027.0,340" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="1027.0,340 1023.3301559224639,331.78219953718923 1030.669844077536,331.78219953718923" fill="#334155"/><rect x="33" y="462" width="896" height="72" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="481.0" y="481.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Agent tools</text><text x="481.0" y="498.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">look up incident · classify attack type · intrusion risk · anomaly · SHAP explanation</text><text x="481.0" y="515.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">prioritize (single or batch) · hybrid incident search · attack-type profiles</text><polyline points="117.0,414 117.0,462" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="117.0,462 113.33015592246387,453.78219953718923 120.66984407753613,453.78219953718923" fill="#334155"/><polyline points="299.0,414 299.0,462" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="299.0,462 295.33015592246386,453.78219953718923 302.66984407753614,453.78219953718923" fill="#334155"/><polyline points="481.0,414 481.0,462" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="481.0,462 477.33015592246386,453.78219953718923 484.66984407753614,453.78219953718923" fill="#334155"/><polyline points="663.0,414 663.0,462" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="663.0,462 659.3301559224639,453.78219953718923 666.6698440775361,453.78219953718923" fill="#334155"/><polyline points="845.0,414 845.0,462" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="845.0,462 841.3301559224639,453.78219953718923 848.6698440775361,453.78219953718923" fill="#334155"/><rect x="33" y="590" width="440" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="253.0" y="609.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Follow-up question</text><text x="253.0" y="626.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">key metrics missing: asks for duration,</text><text x="253.0" y="643.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">packets or bytes instead of guessing</text><rect x="520" y="590" width="587" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="813.5" y="609.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Final answer</text><text x="813.5" y="626.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Assessment · Why (SHAP) · Similar incidents ·</text><text x="813.5" y="643.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Recommended actions · Confidence and limitations</text><polyline points="253,534 253,590" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="253,590 249.33015592246386,581.7821995371892 256.66984407753614,581.7821995371892" fill="#334155"/><text x="263" y="562" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">metrics missing</text><polyline points="700,534 700,590" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="700,590 696.3301559224639,581.7821995371892 703.6698440775361,581.7821995371892" fill="#334155"/><text x="710" y="562" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">findings</text><polyline points="1027.0,414 1027.0,590" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="1027.0,590 1023.3301559224639,581.7821995371892 1030.669844077536,581.7821995371892" fill="#334155"/><rect x="420" y="712" width="300" height="72" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="570.0" y="731.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Output guard</text><text x="570.0" y="748.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">verifies IDs, figures and priority,</text><text x="570.0" y="765.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">removes dangerous commands</text><polyline points="253,662 253,690 520,690 520,712" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="520,712 516.3301559224639,703.7821995371892 523.6698440775361,703.7821995371892" fill="#334155"/><polyline points="813,662 813,690 620,690 620,712" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="620,712 616.3301559224639,703.7821995371892 623.6698440775361,703.7821995371892" fill="#334155"/><rect x="800" y="812" width="300" height="72" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5"/><text x="950.0" y="831.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">LLM-as-Judge</text><text x="950.0" y="848.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">faithfulness, correctness, relevance,</text><text x="950.0" y="865.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">actionability, safety (1-5)</text><polyline points="720,760 950,760 950,812" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="950,812 946.3301559224639,803.7821995371892 953.6698440775361,803.7821995371892" fill="#334155"/><text x="760" y="749" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">quality check on</text><rect x="345" y="912" width="450" height="60" rx="24" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="570.0" y="933.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Answer + agent trace</text><text x="570.0" y="950.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">streamed live; saved to the user's conversation</text><polyline points="570,784 570,912" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="570,912 566.3301559224639,903.7821995371892 573.6698440775361,903.7821995371892" fill="#334155"/><text x="580" y="850" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">quality check off</text><polyline points="950,884 950,942 795,942" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="795,942 803.2178004628108,938.3301559224639 803.2178004628108,945.6698440775361" fill="#334155"/><polyline points="1100,147 1120,147 1120,990 570,990 570,972" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="570,972 573.6698440775361,980.2178004628108 566.3301559224639,980.2178004628108" fill="#334155"/></svg>
