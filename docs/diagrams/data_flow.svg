<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Arial, Helvetica, sans-serif"><title>Data flow: from the CIC-IDS2017 dataset to the user interface</title><rect width="100%" height="100%" fill="white"/><text x="800" y="24" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Data flow: dataset → preprocessing → chunking → embeddings → vector database → retriever → LLM / RAG → agents → API → UI</text><text x="40" y="74" font-size="13" font-weight="bold" fill="#64748B" text-anchor="start" dominant-baseline="central">OFFLINE  ·  build the incident library once</text><rect x="40" y="96" width="270" height="120" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="175.0" y="130.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">1  Dataset</text><text x="175.0" y="147.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">CIC-IDS2017 MachineLearningCVE</text><text x="175.0" y="164.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">8 CSV files, 2,830,743 flows</text><text x="175.0" y="181.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">15 traffic labels</text><rect x="350" y="96" width="270" height="120" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="485.0" y="130.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">2  Preprocessing</text><text x="485.0" y="147.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">PySpark: normalise headers, cast,</text><text x="485.0" y="164.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">inf → null, fix labels,</text><text x="485.0" y="181.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">SHA-256 dedupe → 2,236,725</text><polyline points="310,156 350,156" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="350,156 341.78219953718923,159.66984407753614 341.78219953718923,152.33015592246386" fill="#334155"/><rect x="660" y="96" width="270" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="795.0" y="130.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">3  Chunking</text><text x="795.0" y="147.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">stratified sample: 97,549 incidents</text><text x="795.0" y="164.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">1 flow = 1 template text (one chunk)</text><text x="795.0" y="181.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">≤ 241 tokens, no splitting</text><polyline points="620,156 660,156" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="660,156 651.7821995371892,159.66984407753614 651.7821995371892,152.33015592246386" fill="#334155"/><rect x="970" y="96" width="270" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="1105.0" y="130.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">4  Embeddings</text><text x="1105.0" y="147.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">all-MiniLM-L6-v2</text><text x="1105.0" y="164.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">384-dimension vectors</text><text x="1105.0" y="181.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">batches of 128 (CPU)</text><polyline points="930,156 970,156" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="970,156 961.7821995371892,159.66984407753614 961.7821995371892,152.33015592246386" fill="#334155"/><rect x="1280" y="96" width="270" height="120" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/><text x="1415.0" y="130.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">5  Vector database</text><text x="1415.0" y="147.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">ChromaDB, cosine distance</text><text x="1415.0" y="164.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">+ incident metadata</text><text x="1415.0" y="181.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">(label, port, …)</text><polyline points="1240,156 1280,156" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="1280,156 1271.7821995371892,159.66984407753614 1271.7821995371892,152.33015592246386" fill="#334155"/><rect x="970" y="262" width="270" height="84" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/><text x="1105.0" y="287.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Keyword index</text><text x="1105.0" y="304.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">BM25 (rank-bm25)</text><text x="1105.0" y="321.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">same texts and metadata</text><polyline points="795,216 795,304 970,304" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="970,304 961.7821995371892,307.66984407753614 961.7821995371892,300.33015592246386" fill="#334155"/><text x="40" y="410" font-size="13" font-weight="bold" fill="#7C3AED" text-anchor="start" dominant-baseline="central">AT QUESTION TIME  ·  arrows show how evidence reaches the analyst</text><rect x="40" y="432" width="270" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="175.0" y="466.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">10  User interface</text><text x="175.0" y="483.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Streamlit: chat with live</text><text x="175.0" y="500.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">agent tracker, flow analysis,</text><text x="175.0" y="517.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">search, triage, feedback</text><rect x="350" y="432" width="270" height="120" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="485.0" y="466.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">9  API layer</text><text x="485.0" y="483.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">FastAPI: REST + Server-Sent</text><text x="485.0" y="500.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Events, bearer-token auth,</text><text x="485.0" y="517.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">saved conversations</text><polyline points="350,492 310,492" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="310,492 318.21780046281077,488.33015592246386 318.21780046281077,495.66984407753614" fill="#334155"/><rect x="660" y="432" width="270" height="120" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="795.0" y="466.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">8  Agents</text><text x="795.0" y="483.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">LangGraph supervisor +</text><text x="795.0" y="500.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">4 specialist agents,</text><text x="795.0" y="517.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">guardrails, LLM judge</text><polyline points="660,492 620,492" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="620,492 628.2178004628108,488.33015592246386 628.2178004628108,495.66984407753614" fill="#334155"/><rect x="970" y="432" width="270" height="120" rx="8" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5"/><text x="1105.0" y="466.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">7  LLM / RAG</text><text x="1105.0" y="483.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">grounded answer from the</text><text x="1105.0" y="500.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">evidence, cited incident IDs</text><text x="1105.0" y="517.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">(gpt-oss-20b on NVIDIA NIM)</text><polyline points="970,492 930,492" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="930,492 938.2178004628108,488.33015592246386 938.2178004628108,495.66984407753614" fill="#334155"/><rect x="1280" y="432" width="270" height="120" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="1415.0" y="466.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">6  Retriever</text><text x="1415.0" y="483.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">filters (attack type, port,</text><text x="1415.0" y="500.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">numeric) → BM25 + vector</text><text x="1415.0" y="517.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">→ Reciprocal Rank Fusion</text><polyline points="1280,492 1240,492" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="1240,492 1248.2178004628108,488.33015592246386 1248.2178004628108,495.66984407753614" fill="#334155"/><polyline points="1480,216 1480,432" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="1480,432 1476.330155922464,423.78219953718923 1483.669844077536,423.78219953718923" fill="#334155"/><text x="1490" y="330" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">vector search</text><polyline points="1240,304 1330,304 1330,432" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="1330,432 1326.330155922464,423.78219953718923 1333.669844077536,423.78219953718923" fill="#334155"/><text x="1340" y="380" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">keyword search</text><text x="40" y="610" font-size="13" font-weight="bold" fill="#059669" text-anchor="start" dominant-baseline="central">MACHINE-LEARNING TRACK  ·  models the agents call as tools</text><rect x="350" y="632" width="270" height="110" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/><text x="485.0" y="661.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Feature table</text><text x="485.0" y="678.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">97,548 sampled flows,</text><text x="485.0" y="695.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">24 numeric features</text><text x="485.0" y="712.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">(dst_port excluded)</text><rect x="660" y="632" width="270" height="110" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/><text x="795.0" y="661.5" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Models + SHAP</text><text x="795.0" y="678.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">attack type · intrusion risk ·</text><text x="795.0" y="695.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">anomaly · prioritiser P1–P4</text><text x="795.0" y="712.5" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">SHAP explanations</text><polyline points="620,687 660,687" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="660,687 651.7821995371892,690.6698440775361 651.7821995371892,683.3301559224639" fill="#334155"/><text x="640" y="674" font-size="11.5" fill="#475569" text-anchor="middle" dominant-baseline="central">train</text><polyline points="795,632 795,552" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="795,552 798.6698440775361,560.2178004628108 791.3301559224639,560.2178004628108" fill="#334155"/><text x="805" y="595" font-size="11.5" fill="#475569" text-anchor="start" dominant-baseline="central">tool calls</text><rect x="970" y="632" width="580" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="1260.0" y="670.0" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Feedback loop</text><text x="1260.0" y="687.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">analyst ratings and attack-type corrections (SQLite) →</text><text x="1260.0" y="704.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">guarded retraining: a new classifier is kept only if macro-F1 holds</text><polyline points="970,687 930,687" fill="none" stroke="#334155" stroke-width="1.6"/><polygon points="930,687 938.2178004628108,683.3301559224639 938.2178004628108,690.6698440775361" fill="#334155"/><text x="800" y="800" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Steps 1–5 run once (about 40 minutes on a CPU). Steps 6–10 run for every question: the question goes from the interface (left) to the retriever (right), and the evidence and answer come back along the arrows.</text><text x="800" y="824" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Each incident is one network flow, so each search hit is a complete, citable incident with its own ID and metadata.</text></svg>
